name: Pages publiques - Plugin et CLI

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/cli-vitepress-pages.yml'
      - '.github/scripts/pages-assemble.mjs'
      - '.github/scripts/pages-quality.mjs'
      - 'packages/create-feathers-app/docs/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Construire les deux VitePress
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Recuperer les sources publiques
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Node.js 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: pnpm 10.30.2
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10.30.2
          run_install: false
      - name: Verifier la version pnpm
        run: test "$(pnpm --version)" = "10.30.2"
      - name: Installer les dependances du plugin (lockfile fige)
        run: pnpm --dir docs install --frozen-lockfile --ignore-scripts
      - name: Installer les dependances du CLI (lockfile fige)
        run: pnpm --dir packages/create-feathers-app/docs install --frozen-lockfile --ignore-scripts
      - name: Compiler la documentation du plugin
        env:
          VITEPRESS_BASE: /vite-plugin-feathersjs/
        run: pnpm --dir docs run build
      - name: Compiler la documentation du CLI
        env:
          VITEPRESS_BASE: /vite-plugin-feathersjs/cli/
        run: pnpm --dir packages/create-feathers-app/docs run build
      - name: Assembler et controler un artefact public unique
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/vite-feathers-public-pages
        run: node .github/scripts/pages-assemble.mjs
      - name: Verifier les liens et assets du site final
        env:
          PAGES_OUTPUT_DIR: ${{ runner.temp }}/vite-feathers-public-pages
        run: node .github/scripts/pages-quality.mjs
      - name: Configurer GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Charger l'artefact Pages unique
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: ${{ runner.temp }}/vite-feathers-public-pages

  deploy:
    name: Publier GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deployer les deux guides
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
