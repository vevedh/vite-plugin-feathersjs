name: CLI Documentation (VitePress / GitHub Pages)
on:
  push:
    branches: [main]
    paths:
      - 'docs/cli/**'
      - '.github/workflows/cli-vitepress-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: cli-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/configure-pages@v5
      - name: Install docs dependencies
        working-directory: docs/cli
        run: npm install --no-audit --no-fund --ignore-scripts
      - name: Build VitePress
        working-directory: docs/cli
        env:
          VITEPRESS_BASE: /vite-plugin-feathersjs/
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs/cli/.vitepress/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
